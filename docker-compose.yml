services:
  nginx:
    image: nginx:alpine
    ports:
      - "9999:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app1
      - app2
    networks:
      - lb-net
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: 50MB

  app1:
    image: ghcr.io/jvsouzx/rb-2026-buckets:0.0.1
    networks:
      - lb-net
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: 150MB

  app2:
    image: ghcr.io/jvsouzx/rb-2026-buckets:0.0.1
    networks:
      - lb-net
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: 150MB

networks:
  lb-net:
    driver: bridge
